name: Build desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux build and test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libxdo-dev patchelf xvfb openbox xdotool webkit2gtk-driver dbus-x11 imagemagick
      - name: Select Rust toolchain
        run: rustup default stable
      - run: npm ci
      - run: npm test
      - run: npm run desktop:test:files
      - name: Build Linux deb
        if: runner.os == 'Linux'
        run: npm run desktop:build -- --bundles deb
      - name: Build Windows installer with offline WebView runtime
        if: runner.os == 'Windows'
        run: npm run desktop:build -- --config src-tauri/tauri.windows.conf.json --bundles nsis
      - name: Install Linux UI test drivers
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver --version 2.1.0 --locked
          npx playwright install --with-deps chromium
      - name: Test application extracted from deb
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/rocos-package"
          dpkg-deb --extract src-tauri/target/release/bundle/deb/*.deb "$RUNNER_TEMP/rocos-package"
          ROCOS_DESKTOP_BINARY="$RUNNER_TEMP/rocos-package/usr/bin/rocos-configurator" npm run desktop:test:ui
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        with:
          name: rocos-desktop-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: desktop-test-results
          path: test-results/desktop/
